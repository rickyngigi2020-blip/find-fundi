# Two jobs on one schedule.
#
# The search for a fundi has to keep running when nobody has a page open, and
# the free tiers give us no background worker, so this stands in for one. It
# also keeps Supabase from pausing, which it does after about 7 days idle.
#
# GitHub's scheduler is best-effort and runs late under load, so nothing here
# depends on exact timing.
name: Keep Find Fundi running

on:
  schedule:
    # Every 10 minutes: often enough that a waiting customer is not left long,
    # cheap enough to stay well inside the free allowance.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Move waiting jobs on to the next fundi
        run: |
          status=$(curl -sS -m 60 -X POST -w '%{http_code}' -o /tmp/tick.json https://find-fundi.vercel.app/api/v1/tick || echo "000")
          echo "HTTP $status"
          cat /tmp/tick.json 2>/dev/null || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Tick failed with status $status."
            exit 1
          fi

  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          status=$(curl -sS -m 30 -w '%{http_code}' -o /tmp/health.json https://find-fundi.vercel.app/api/v1/health || echo "000")
          echo "HTTP $status"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Health check failed with status $status. The Supabase project may be paused - restore it at supabase.com/dashboard."
            exit 1
          fi
