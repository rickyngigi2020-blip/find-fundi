<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Find Fundi</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { navy: { DEFAULT: '#041530', soft: '#0D2547' }, orange: { DEFAULT: '#FE6902', 50: '#FFF1E6' } },
      fontFamily: { display: ['"Poppins"', 'sans-serif'], body: ['"Inter"', 'sans-serif'] },
    } }
  }
</script>
<style>
  body { -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid #FE6902; outline-offset: 2px; border-radius: 2px; }
  .btn-primary {
    background: linear-gradient(180deg, #FE8A3D 0%, #FE6902 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 10px 22px -6px rgba(254,105,2,0.45);
    transition: transform 180ms cubic-bezier(.22,1,.36,1), filter 180ms ease;
  }
  .btn-primary:disabled { opacity: 0.55; pointer-events: none; }
  input:focus, select:focus { border-color: #FE6902; box-shadow: 0 0 0 3px rgba(254,105,2,0.12); }
  .status-pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
  .role-tab { transition: background-color 160ms ease, color 160ms ease; }
  .role-tab[aria-selected="true"] { background: #041530; color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-gray-50 text-navy font-body antialiased min-h-screen">

<header class="bg-white border-b border-navy/10">
  <div class="max-w-2xl mx-auto px-5 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <img src="assets/logo-mark.png" alt="Find Fundi" class="h-8 w-8 object-contain">
      <span class="font-display font-700 text-[17px]"><span class="text-navy">Find</span><span class="text-orange">Fundi</span></span>
    </a>
    <nav class="flex items-center gap-5 text-[14px] font-semibold text-navy/70">
      <a href="my-jobs.html" class="hover:text-navy">My jobs</a>
      <a id="adminLink" href="admin.html" hidden class="text-orange hover:underline">Admin</a>
      <button id="logoutBtn" hidden class="hover:text-navy">Log out</button>
    </nav>
  </div>
</header>

<main class="max-w-2xl mx-auto px-5 py-10">
  <div id="signedOutNotice" hidden class="bg-white rounded-2xl border border-navy/10 p-8 text-center">
    <h1 class="font-display font-800 text-[1.5rem] text-navy">Sign in to view your profile</h1>
    <a href="login.html?next=profile.html" class="btn-primary inline-block mt-6 text-white font-semibold text-[14.5px] px-6 py-2.5 rounded-lg">Sign in</a>
  </div>

  <div id="content" hidden class="bg-white rounded-2xl border border-navy/10 p-6 md:p-7">
    <h1 id="pageTitle" class="font-display font-800 text-[1.4rem] text-navy">Your profile</h1>
    <p id="pageSubtitle" hidden class="mt-1.5 text-navy/60 text-[14.5px]">A couple more details to finish setting up your account.</p>
    <div id="fundiStatus" hidden class="mt-3 flex items-center gap-3"></div>
    <a id="applyLink" href="apply.html" hidden class="mt-3 inline-block text-orange font-semibold text-[13.5px] hover:underline">Apply as a fundi &rarr;</a>

    <div id="roleToggle" hidden role="tablist" class="mt-5 grid grid-cols-2 gap-2 p-1 bg-gray-100 rounded-lg">
      <button type="button" id="roleCustomer" role="tab" aria-selected="true" class="role-tab rounded-md py-2 text-[14px] font-semibold border border-transparent">I need a repair</button>
      <button type="button" id="roleFundi" role="tab" aria-selected="false" class="role-tab rounded-md py-2 text-[14px] font-semibold border border-transparent">I'm a fundi</button>
    </div>

    <form id="profileForm" class="mt-5 space-y-4">
      <div>
        <label class="block text-[13px] font-semibold text-navy/70 mb-1.5" for="fullName">Full name</label>
        <input id="fullName" required type="text" class="w-full rounded-lg border border-navy/15 px-3.5 py-2.5 text-[15px] outline-none">
      </div>
      <div>
        <label class="block text-[13px] font-semibold text-navy/70 mb-1.5" for="phone">Phone number</label>
        <input id="phone" required type="tel" class="w-full rounded-lg border border-navy/15 px-3.5 py-2.5 text-[15px] outline-none">
      </div>
      <div>
        <label class="block text-[13px] font-semibold text-navy/70 mb-1.5" for="area">Area</label>
        <select id="area" required class="w-full rounded-lg border border-navy/15 px-3.5 py-2.5 text-[15px] outline-none bg-white">
          <option value="">Select your area</option>
          <option>CBD</option><option>Westlands</option><option>Kilimani</option><option>Karen</option>
          <option>Lavington</option><option>Parklands</option><option>Eastleigh</option><option>Kasarani</option>
          <option>South C</option><option>Embakasi</option><option>Kikuyu</option><option>Ruiru</option>
        </select>
      </div>

      <p id="formError" class="hidden text-[13.5px] text-red-600"></p>
      <p id="formSuccess" class="hidden text-[13.5px] text-green-700"></p>

      <button type="submit" id="submitBtn" class="btn-primary text-white font-semibold text-[14.5px] px-6 py-2.5 rounded-lg">
        Save changes
      </button>
    </form>
  </div>
</main>

<script src="assets/supabase-client.js"></script>
<script>
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  const form = document.getElementById('profileForm');
  const formError = document.getElementById('formError');
  const formSuccess = document.getElementById('formSuccess');
  const submitBtn = document.getElementById('submitBtn');
  const roleToggle = document.getElementById('roleToggle');
  const roleCustomer = document.getElementById('roleCustomer');
  const roleFundi = document.getElementById('roleFundi');

  let selectedRole = 'customer';
  function setRole(next) {
    selectedRole = next;
    roleCustomer.setAttribute('aria-selected', String(next === 'customer'));
    roleFundi.setAttribute('aria-selected', String(next === 'fundi'));
  }
  roleCustomer.addEventListener('click', () => setRole('customer'));
  roleFundi.addEventListener('click', () => setRole('fundi'));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.classList.add('hidden');
    formSuccess.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    const isNewProfile = form.dataset.isNew === 'true';

    try {
      await apiFetch('/profile', {
        method: 'POST',
        body: JSON.stringify({
          full_name: document.getElementById('fullName').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          area: document.getElementById('area').value,
          role: isNewProfile ? selectedRole : form.dataset.role,
        }),
      });

      if (isNewProfile) {
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = next || (selectedRole === 'fundi' ? 'apply.html' : 'book.html');
        return;
      }
      formSuccess.textContent = 'Saved.';
      formSuccess.classList.remove('hidden');
    } catch (err) {
      formError.textContent = err.message;
      formError.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save changes';
    }
  });

  (async function init() {
    const session = await getSession();
    if (!session) {
      document.getElementById('signedOutNotice').hidden = false;
      return;
    }
    document.getElementById('logoutBtn').hidden = false;
    document.getElementById('content').hidden = false;

    let profile = null;
    try {
      profile = await apiFetch('/profile/me');
    } catch (err) {
      if (err.message !== 'Not found.') throw err;
    }

    if (!profile) {
      // Brand-new account (e.g. just signed up via Google) — no profile row yet.
      form.dataset.isNew = 'true';
      document.getElementById('pageTitle').textContent = 'Complete your account';
      document.getElementById('pageSubtitle').hidden = false;
      roleToggle.hidden = false;
      submitBtn.textContent = 'Continue';

      const params = new URLSearchParams(window.location.search);
      setRole(params.get('role') === 'fundi' ? 'fundi' : 'customer');

      const meta = session.user.user_metadata || {};
      document.getElementById('fullName').value = meta.full_name || meta.name || '';
      return;
    }

    const next = new URLSearchParams(window.location.search).get('next');
    if (next) {
      window.location.href = next;
      return;
    }

    if (profile.is_admin) document.getElementById('adminLink').hidden = false;

    form.dataset.role = profile.role;
    document.getElementById('fullName').value = profile.full_name || '';
    document.getElementById('phone').value = profile.phone || '';
    document.getElementById('area').value = profile.area || '';

    if (profile.fundi_profile) {
      const el = document.getElementById('fundiStatus');
      const labels = { pending: 'Fundi status: Verification pending', verified: 'Fundi status: Verified', rejected: 'Fundi status: Not approved' };
      const styles = { pending: 'bg-orange-50 text-orange-700', verified: 'bg-green-50 text-green-700', rejected: 'bg-red-50 text-red-600' };
      const vs = profile.fundi_profile.verification_status;
      el.innerHTML = `<span class="status-pill ${styles[vs]}">${labels[vs]}</span>`;
      if (vs === 'verified') {
        el.innerHTML += '<a href="job-feed.html" class="text-orange font-semibold text-[13.5px] hover:underline">Go to job feed &rarr;</a>';
      }
      el.hidden = false;
    } else {
      document.getElementById('applyLink').hidden = false;
    }
  })();
</script>
</body>
</html>
