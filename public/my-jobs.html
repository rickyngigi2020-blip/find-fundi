<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My activity — Find Fundi</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#041530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { navy: { DEFAULT: '#041530', soft: '#0D2547' }, orange: { DEFAULT: '#FE6902', 50: '#FFF1E6' } },
      fontFamily: { display: ['"Poppins"', 'sans-serif'], body: ['"Inter"', 'sans-serif'] },
    } }
  }
</script>
<style>
  body { -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid #FE6902; outline-offset: 2px; border-radius: 2px; }
  .btn-primary {
    background: linear-gradient(180deg, #FE8A3D 0%, #FE6902 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 10px 22px -6px rgba(254,105,2,0.45);
    transition: transform 180ms cubic-bezier(.22,1,.36,1), filter 180ms ease;
  }
  .btn-primary:disabled { opacity: 0.55; pointer-events: none; }
  .status-pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
  .star-btn { transition: color 120ms ease; }
  .map-box { height: 200px; border-radius: 12px; overflow: hidden; }
  .pay-choice { transition: border-color 160ms ease, background-color 160ms ease; }
  .pay-choice:hover { border-color: rgba(4,21,48,0.3); }
  .pay-choice:has(input:checked) { border-color: #FE6902; background: #FFF1E6; }
  .pay-choice:has(input:focus-visible) { outline: 2px solid #FE6902; outline-offset: 2px; }
  .btn-danger { transition: background-color 160ms ease, color 160ms ease; }
  .btn-danger:hover { background: #FEF2F2; color: #B91C1C; }
  .btn-danger:active { background: #FEE2E2; }
  .btn-outline { transition: background-color 160ms ease; }
  .btn-outline:active { background: rgba(4,21,48,0.09); }
  .btn-danger:disabled, .btn-outline:disabled { opacity: 0.55; pointer-events: none; }
  /* Matches book.html: shows the search is still running. */
  .search-pulse { width: 10px; height: 10px; border-radius: 9999px; background: #FE6902; position: relative; }
  .search-pulse::after {
    content: ""; position: absolute; inset: 0; border-radius: 9999px; background: #FE6902;
    animation: searchPulse 1800ms cubic-bezier(.22,1,.36,1) infinite;
  }
  @keyframes searchPulse {
    0% { transform: scale(1); opacity: 0.55; }
    70%, 100% { transform: scale(2.6); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .search-pulse::after { animation: none; } }
  .btn-quiet { transition: background-color 160ms ease, color 160ms ease; }
  .btn-quiet:hover { background: rgba(4,21,48,0.05); }
  .btn-quiet:active { background: rgba(4,21,48,0.09); }
  .icon-link { transition: background-color 160ms ease, color 160ms ease; }
  .icon-link svg { transition: transform 320ms cubic-bezier(.22,1,.36,1); }
  .icon-link:hover svg { transform: rotate(45deg); }
  .icon-link:active { background: rgba(4,21,48,0.09); }
  @media (prefers-reduced-motion: reduce) { .icon-link svg { transition: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-gray-50 text-navy font-body antialiased min-h-screen">

<header class="bg-white border-b border-navy/10">
  <div class="max-w-3xl mx-auto px-5 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <img src="assets/logo-mark.png" alt="Find Fundi" class="h-8 w-8 object-contain">
      <span class="font-display font-700 text-[17px]"><span class="text-navy">Find</span><span class="text-orange">Fundi</span></span>
    </a>
    <nav class="flex items-center gap-1">
      <a href="book.html" class="btn-quiet px-2.5 py-2 rounded-md text-[14px] font-semibold text-navy/70 hover:text-navy">Book a fundi</a>
      <a href="profile.html" class="icon-link w-9 h-9 rounded-md flex items-center justify-center text-navy/60 hover:text-navy hover:bg-navy/5" aria-label="Account settings" title="Account settings">
        <svg class="w-[19px] h-[19px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-5 py-10">
  <div id="signedOutNotice" hidden class="bg-white rounded-2xl border border-navy/10 p-8 text-center">
    <h1 class="font-display font-800 text-[1.5rem] text-navy">Sign in to see your activity</h1>
    <a href="login.html?next=my-jobs.html" class="btn-primary inline-block mt-6 text-white font-semibold text-[14.5px] px-6 py-2.5 rounded-lg">Sign in</a>
  </div>

  <div id="content" hidden>
    <h1 class="font-display font-800 text-[1.6rem] tracking-[-0.02em] text-navy">My activity</h1>
    <div id="pushPrompt" hidden class="mt-5"></div>
    <div id="jobList" class="mt-6 space-y-4"></div>
    <p id="emptyState" hidden class="mt-6 text-navy/60 text-[15px]">No jobs yet. <a href="book.html" class="text-orange font-semibold hover:underline">Book a fundi</a> to get started.</p>
  </div>
</main>

<template id="jobCardTemplate">
  <div class="job-card bg-white rounded-2xl border border-navy/10 p-5">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="font-display font-700 text-[15.5px] text-navy category"></p>
        <p class="text-[13.5px] text-navy/55 mt-0.5 description"></p>
      </div>
      <span class="status-pill shrink-0"></span>
    </div>
    <div class="mt-3 text-[13px] text-navy/50 area-urgency"></div>
    <div class="media-section"></div>
    <div class="contact-section"></div>
    <div class="pick-section"></div>
    <div class="quote-section"></div>
    <div class="revision-section"></div>
    <div class="tracking-section mt-4 hidden"></div>
    <div class="review-section mt-4 hidden pt-4 border-t border-navy/10"></div>
    <div class="cancel-section"></div>
  </div>
</template>

<script src="assets/supabase-client.js"></script>
<script src="assets/map.js"></script>
<script src="assets/categories.js"></script>
<script src="assets/job-media.js"></script>
<script src="assets/push.js"></script>
<script>
  const STATUS_STYLES = {
    requested: 'bg-gray-100 text-navy/60',
    matched: 'bg-orange-50 text-orange-700',
    in_progress: 'bg-orange-50 text-orange-700',
    completed: 'bg-green-50 text-green-700',
    cancelled: 'bg-red-50 text-red-600',
  };
  const STATUS_LABELS = {
    requested: 'Finding a fundi', matched: 'Booked', in_progress: 'Price agreed',
    completed: 'Completed', cancelled: 'Cancelled',
  };

  function statusLabel(job) {
    if (job.status === 'matched' && job.quote_amount) return 'Price to review';
    return STATUS_LABELS[job.status] || job.status;
  }

  // Price agreement: the fundi sends a quote after calling, the customer accepts
  // it here and picks how they'll pay. Re-renders itself after each change.
  function renderQuoteSection(section, job, pill) {
    section.replaceChildren();
    pill.textContent = statusLabel(job);
    pill.className = 'status-pill shrink-0 ' + (STATUS_STYLES[job.status] || 'bg-gray-100 text-navy/60');
    if (!job.fundi_id) return;

    const fundiName = (job.counterpart && job.counterpart.full_name) || 'Your fundi';
    const box = document.createElement('div');
    box.className = 'mt-3 rounded-xl border px-4 py-3';

    if (job.status === 'matched' && !job.quote_amount) {
      box.classList.add('border-navy/10');
      const p = document.createElement('p');
      p.className = 'text-[13.5px] text-navy/65 leading-[1.55]';
      p.textContent = `Waiting for a price. ${fundiName} will call you to understand the job, then send the price here.`;
      box.appendChild(p);
      section.appendChild(box);
      return;
    }

    if (job.status === 'matched' && job.quote_amount) {
      box.classList.add('border-orange/40', 'bg-orange-50/60');
      box.innerHTML = `
        <p class="text-[12px] font-semibold uppercase tracking-wide text-navy/50">Price from <span class="q-name"></span></p>
        <p class="mt-0.5 font-display font-800 text-[1.6rem] tracking-[-0.02em] text-navy q-amount"></p>
        <p class="q-note mt-1 text-[13.5px] text-navy/70 leading-[1.55] whitespace-pre-line"></p>
        <fieldset class="mt-3">
          <legend class="text-[13px] font-semibold text-navy/70 mb-2">How will you pay?</legend>
          <div class="grid grid-cols-3 gap-2">
            <label class="pay-choice cursor-pointer rounded-lg border border-navy/15 bg-white py-2.5 text-center text-[13.5px] font-semibold text-navy"><input type="radio" name="pay-${job.id}" value="mpesa" class="sr-only">M-Pesa</label>
            <label class="pay-choice cursor-pointer rounded-lg border border-navy/15 bg-white py-2.5 text-center text-[13.5px] font-semibold text-navy"><input type="radio" name="pay-${job.id}" value="card" class="sr-only">Card</label>
            <label class="pay-choice cursor-pointer rounded-lg border border-navy/15 bg-white py-2.5 text-center text-[13.5px] font-semibold text-navy"><input type="radio" name="pay-${job.id}" value="cash" class="sr-only">Cash</label>
          </div>
        </fieldset>
        <p class="q-error hidden mt-2 text-[13px] text-red-600" role="alert"></p>
        <button type="button" class="q-accept btn-primary mt-3 w-full text-white font-semibold text-[14.5px] px-4 py-2.5 rounded-lg">Accept price</button>
        <p class="mt-2 text-[12.5px] text-navy/50 leading-[1.5]">Not right? Call your fundi to talk it through. They can send a new price before you accept.</p>
      `;
      box.querySelector('.q-name').textContent = fundiName;
      box.querySelector('.q-amount').textContent = formatKsh(job.quote_amount);
      const note = box.querySelector('.q-note');
      if (job.quote_note) note.textContent = job.quote_note; else note.remove();

      const errorEl = box.querySelector('.q-error');
      const btn = box.querySelector('.q-accept');
      btn.addEventListener('click', async () => {
        errorEl.classList.add('hidden');
        const chosen = box.querySelector(`input[name="pay-${job.id}"]:checked`);
        if (!chosen) {
          errorEl.textContent = 'Choose how you will pay first.';
          errorEl.classList.remove('hidden');
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Accepting…';
        try {
          const updated = await apiFetch(`/jobs/${job.id}/accept-quote`, {
            method: 'POST',
            body: JSON.stringify({ payment_method: chosen.value, quoted_at: job.quoted_at }),
          });
          renderQuoteSection(section, { ...updated, counterpart: job.counterpart }, pill);
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Accept price';
          if (/changed the price/i.test(err.message)) {
            const fresh = (await apiFetch('/jobs/mine?role=customer')).find((j) => j.id === job.id);
            if (fresh) {
              renderQuoteSection(section, fresh, pill);
              const again = section.querySelector('.q-error');
              if (again) { again.textContent = err.message; again.classList.remove('hidden'); }
            }
          }
        }
      });
      section.appendChild(box);
      return;
    }

    if (job.final_cost) {
      box.classList.add('border-navy/10');
      const label = job.status === 'completed' ? 'Final price' : 'Agreed price';
      const p = document.createElement('p');
      p.className = 'text-[13.5px] text-navy/70';
      p.innerHTML = '<span class="font-semibold text-navy q-label"></span> <span class="q-amount font-semibold text-navy"></span><span class="q-pay"></span>';
      p.querySelector('.q-label').textContent = `${label}:`;
      p.querySelector('.q-amount').textContent = formatKsh(job.final_cost);
      p.querySelector('.q-pay').textContent = job.payment_method ? ` · Paying by ${PAYMENT_LABELS[job.payment_method]}` : '';
      box.appendChild(p);
      section.appendChild(box);
    }
  }

  async function setupTracking(job, mapId, waitingNote) {
    const points = [];
    if (job.customer_lat != null && job.customer_lng != null) {
      points.push({ key: 'customer', position: { lat: job.customer_lat, lng: job.customer_lng }, label: 'C', title: 'You' });
    }
    const handle = await renderPinMap(mapId, points);

    const { data: existing } = await sb
      .from('fundi_locations')
      .select('lat, lng')
      .eq('fundi_id', job.fundi_id)
      .maybeSingle();
    if (existing) {
      handle.setMarker('fundi', { lat: existing.lat, lng: existing.lng }, 'F', 'Your fundi');
      waitingNote.hidden = true;
    }

    sb.channel(`fundi-location-${job.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'fundi_locations', filter: `fundi_id=eq.${job.fundi_id}` }, (payload) => {
        if (!payload.new) return;
        handle.setMarker('fundi', { lat: payload.new.lat, lng: payload.new.lng }, 'F', 'Your fundi');
        waitingNote.hidden = true;
      })
      .subscribe();
  }

  const OPEN_STATUSES = ['requested', 'matched', 'in_progress'];

  // A job with no fundi yet (still being offered round, or the fundi who took
  // it turned it down). The customer does not pick anyone: this just reports
  // where the search has got to, and can send it round again if it stalled.
  // A job with no fundi yet. The customer does not pick anyone and has nothing
  // to press: the search runs on its own until someone takes it.
  function renderPickSection(section, job) {
    const box = document.createElement('div');
    box.className = 'mt-3 rounded-xl border border-navy/10 px-4 py-3';
    const dead = Boolean(job.search_exhausted_at);
    box.innerHTML = `
      <div class="flex items-start gap-2.5">
        ${dead ? '' : '<span class="search-pulse shrink-0 mt-1.5" aria-hidden="true"></span>'}
        <div>
          <p class="text-[13.5px] font-semibold text-navy">${dead ? 'No fundi for this trade yet' : 'Finding your fundi'}</p>
          <p class="text-[13.5px] text-navy/60 leading-[1.55] mt-0.5">${dead
            ? 'There is no approved fundi in this category at the moment. We keep trying as fundis join, and will notify you.'
            : 'Your job is being offered to fundis one at a time. We will notify you as soon as someone takes it.'}</p>
        </div>
      </div>
    `;
    section.appendChild(box);
  }

  // Cancelling asks for confirmation inline, with an optional reason that is
  // passed on to the booked fundi.
  // The fundi has found the job is bigger than the price covers. The customer
  // reads why and decides. Nothing changes until they do, and turning it down
  // leaves the agreed price standing rather than ending the job.
  function renderRevisionSection(section, job) {
    const change = job.pending_price_change;

    if (!change) {
      if (!job.materials_since) return;
      const note = document.createElement('div');
      note.className = 'mt-3 rounded-xl border border-navy/10 bg-gray-50 px-4 py-3';
      note.innerHTML = `
        <p class="text-[13.5px] font-semibold text-navy">Your fundi has gone for materials</p>
        <p class="mt-0.5 text-[13.5px] text-navy/60 leading-[1.55]">${escapeHtml(job.materials_note || 'They are getting what the job needs and will be back.')}</p>
      `;
      section.appendChild(note);
      return;
    }

    const up = change.amount > change.previous_amount;
    const box = document.createElement('div');
    box.className = 'mt-3 rounded-xl border-2 border-orange bg-orange-50 px-4 py-3.5';
    box.innerHTML = `
      <p class="text-[12.5px] font-semibold uppercase tracking-[0.06em] text-orange-700">New price to agree</p>
      <div class="mt-1.5 flex items-baseline gap-2.5 flex-wrap">
        <span class="font-display font-800 text-[1.35rem] text-navy tabular-nums">${formatKsh(change.amount)}</span>
        <span class="text-[13.5px] text-navy/50">was <span class="line-through">${formatKsh(change.previous_amount)}</span></span>
      </div>
      <p class="mt-2 text-[13.5px] text-navy/70 leading-[1.6]">${escapeHtml(change.reason)}</p>
      <p class="mt-2 text-[12.5px] text-navy/55 leading-[1.5]">${up
        ? 'You only pay the new amount if you accept it. Turn it down and the price you already agreed stands.'
        : 'Your fundi has lowered the price.'}</p>
      <p class="pc-error hidden mt-2 text-[13px] text-red-600" role="alert"></p>
      <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" class="pc-yes btn-primary rounded-lg px-4 py-2 text-[13.5px] font-semibold text-white">Accept ${formatKsh(change.amount)}</button>
        <button type="button" class="pc-no btn-quiet rounded-lg border border-navy/15 px-4 py-2 text-[13.5px] font-semibold text-navy">Keep the old price</button>
      </div>
    `;

    const errorEl = box.querySelector('.pc-error');
    const answer = async (btn, accept, label) => {
      errorEl.classList.add('hidden');
      box.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      btn.textContent = label;
      try {
        await apiFetch(`/jobs/${job.id}/answer-price`, { method: 'POST', body: JSON.stringify({ accept }) });
        await loadJobs();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        box.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      }
    };

    box.querySelector('.pc-yes').addEventListener('click', (e) => answer(e.target, true, 'Accepting...'));
    box.querySelector('.pc-no').addEventListener('click', (e) => answer(e.target, false, 'Saving...'));
    section.appendChild(box);
  }

  function renderCancelSection(section, job) {
    const wrap = document.createElement('div');
    wrap.className = 'mt-4 border-t border-navy/10 pt-3';
    const showButton = () => {
      wrap.innerHTML = '<button type="button" class="c-open btn-danger -ml-3 rounded-lg px-3 py-1.5 text-[13.5px] font-semibold text-navy/60">Cancel job</button>';
      wrap.querySelector('.c-open').addEventListener('click', showConfirm);
    };
    const showConfirm = () => {
      wrap.innerHTML = `
        <p class="text-[13.5px] font-semibold text-navy">Cancel this job?</p>
        <p class="c-hint mt-0.5 text-[12.5px] text-navy/55"></p>
        <label class="mt-2.5 block">
          <span class="sr-only">Reason (optional)</span>
          <input type="text" maxlength="300" class="c-reason w-full rounded-lg border border-navy/15 px-3 py-2 text-[14px] outline-none focus:border-orange" placeholder="Reason (optional)">
        </label>
        <p class="c-error hidden mt-2 text-[13px] text-red-600" role="alert"></p>
        <div class="mt-2.5 flex flex-wrap gap-2">
          <button type="button" class="c-yes rounded-lg bg-red-600 px-4 py-2 text-[13.5px] font-semibold text-white hover:bg-red-700 active:bg-red-800 disabled:opacity-55">Yes, cancel job</button>
          <button type="button" class="c-no btn-outline rounded-lg border border-navy/15 px-4 py-2 text-[13.5px] font-semibold text-navy hover:bg-navy/5">Keep job</button>
        </div>
      `;
      wrap.querySelector('.c-hint').textContent = job.fundi_id
        ? 'Your fundi will be told it is cancelled.'
        : 'Fundis will no longer see it in open jobs.';
      wrap.querySelector('.c-no').addEventListener('click', showButton);
      const yes = wrap.querySelector('.c-yes');
      yes.addEventListener('click', async () => {
        yes.disabled = true;
        yes.textContent = 'Cancelling…';
        try {
          await apiFetch(`/jobs/${job.id}/cancel`, { method: 'POST', body: JSON.stringify({ reason: wrap.querySelector('.c-reason').value }) });
          await loadJobs();
        } catch (err) {
          const errorEl = wrap.querySelector('.c-error');
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
          yes.disabled = false;
          yes.textContent = 'Yes, cancel job';
        }
      });
      wrap.querySelector('.c-reason').focus();
    };
    showButton();
    section.appendChild(wrap);
  }

  function renderCancelledNote(section, job) {
    const p = document.createElement('p');
    p.className = 'mt-3 rounded-xl bg-gray-50 px-4 py-3 text-[13.5px] text-navy/65';
    // The reason is kept for the fundi who was told and for admins. Showing it
    // back to the person who wrote it adds nothing.
    p.textContent = job.cancelled_by === 'admin' ? 'Cancelled by Find Fundi.' : 'You cancelled this job.';
    section.appendChild(p);
  }

  function renderJob(job) {
    const tpl = document.getElementById('jobCardTemplate').content.cloneNode(true);
    tpl.querySelector('.category').textContent = CATEGORY_LABELS[job.category] || job.category;
    tpl.querySelector('.description').textContent = jobSummaryText(job);
    renderJobMedia(tpl.querySelector('.media-section'), job);
    const pill = tpl.querySelector('.status-pill');
    tpl.querySelector('.area-urgency').textContent =
      [job.subcategory, job.area, job.urgency === 'urgent' ? 'Urgent' : null].filter(Boolean).join(' · ');
    if (job.counterpart) {
      tpl.querySelector('.contact-section').appendChild(renderContactCard(job.counterpart, 'Your fundi'));
    }
    renderQuoteSection(tpl.querySelector('.quote-section'), job, pill);

    // A price the fundi wants to change, and whether they have gone for parts.
    if (job.status === 'in_progress') {
      renderRevisionSection(tpl.querySelector('.revision-section'), job);
    }
    if (job.status === 'requested') renderPickSection(tpl.querySelector('.pick-section'), job);
    if (OPEN_STATUSES.includes(job.status)) renderCancelSection(tpl.querySelector('.cancel-section'), job);
    if (job.status === 'cancelled') renderCancelledNote(tpl.querySelector('.cancel-section'), job);

    // The map needs a Google Maps key; without one, don't show a broken map.
    if ((job.status === 'matched' || job.status === 'in_progress') && hasMapsKey()) {
      const trackingSection = tpl.querySelector('.tracking-section');
      trackingSection.classList.remove('hidden');
      const mapId = `track-map-${job.id}`;
      trackingSection.innerHTML = `
        <p class="text-[13px] font-semibold text-navy/70 mb-2">Track your fundi</p>
        <div id="${mapId}" class="map-box bg-gray-100"></div>
        <p class="waiting-note mt-2 text-[12.5px] text-navy/50">Waiting for your fundi to share their location.</p>
      `;
      setupTracking(job, mapId, trackingSection.querySelector('.waiting-note'));
    }

    // A job that has already been rated shows that rating back, rather than
    // offering the form again and failing on a second submission.
    if (job.status === 'completed' && job.review) {
      const section = tpl.querySelector('.review-section');
      section.classList.remove('hidden');
      section.innerHTML = `
        <p class="text-[13px] font-semibold text-navy/70 mb-2">You rated this job</p>
        <div class="flex gap-1 items-center">
          ${[1, 2, 3, 4, 5].map((n) => `<span class="text-2xl ${n <= job.review.rating ? 'text-orange' : 'text-navy/15'}" aria-hidden="true">★</span>`).join('')}
          <span class="sr-only">${job.review.rating} out of 5</span>
        </div>
        ${job.review.comment ? `<p class="mt-2 text-[13.5px] text-navy/65 leading-[1.6]">${escapeHtml(job.review.comment)}</p>` : ''}
      `;
    } else if (job.status === 'completed') {
      const section = tpl.querySelector('.review-section');
      section.classList.remove('hidden');
      section.innerHTML = `
        <p class="text-[13px] font-semibold text-navy/70 mb-2">Rate this job</p>
        <div class="flex gap-1 mb-3" data-rating="0">
          ${[1,2,3,4,5].map(n => `<button type="button" class="star-btn text-2xl text-navy/20" data-star="${n}">★</button>`).join('')}
        </div>
        <textarea rows="2" class="w-full rounded-lg border border-navy/15 px-3 py-2 text-[14px] outline-none resize-none review-comment" placeholder="How did it go? (optional)"></textarea>
        <button class="btn-primary mt-2.5 text-white font-semibold text-[13.5px] px-4 py-2 rounded-lg submit-review">Submit review</button>
        <p class="hidden mt-2 text-[13px] text-red-600 review-error"></p>
      `;
      const starsWrap = section.querySelector('[data-rating]');
      const stars = section.querySelectorAll('.star-btn');
      stars.forEach(star => {
        star.addEventListener('click', () => {
          const val = Number(star.dataset.star);
          starsWrap.dataset.rating = val;
          stars.forEach(s => s.classList.toggle('text-orange', Number(s.dataset.star) <= val));
          stars.forEach(s => s.classList.toggle('text-navy/20', Number(s.dataset.star) > val));
        });
      });
      section.querySelector('.submit-review').addEventListener('click', async (e) => {
        const rating = Number(starsWrap.dataset.rating);
        const errorEl = section.querySelector('.review-error');
        errorEl.classList.add('hidden');
        if (!rating) {
          errorEl.textContent = 'Pick a star rating first.';
          errorEl.classList.remove('hidden');
          return;
        }
        e.target.disabled = true;
        e.target.textContent = 'Submitting…';
        try {
          await apiFetch(`/jobs/${job.id}/review`, {
            method: 'POST',
            body: JSON.stringify({ rating, comment: section.querySelector('.review-comment').value.trim() || null }),
          });
          section.innerHTML = '<p class="text-[13.5px] text-navy/60">Thanks for your review.</p>';
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
          e.target.disabled = false;
          e.target.textContent = 'Submit review';
        }
      });
    }
    return tpl;
  }

  async function loadJobs() {
    const jobs = await apiFetch('/jobs/mine?role=customer');
    // Re-rendering replaces the maps, so drop their live location channels.
    sb.removeAllChannels();
    document.getElementById('jobList').replaceChildren(...jobs.map((job) => renderJob(job)));
    document.getElementById('emptyState').hidden = jobs.length > 0;
  }

  (async function init() {
    const session = await getSession();
    if (!session) {
      document.getElementById('signedOutNotice').hidden = false;
      return;
    }
    document.getElementById('content').hidden = false;
    mountPushPrompt(document.getElementById('pushPrompt'), "Get a notification when a fundi sends a price, finishes a job, or can't make it.");
    // A notification means one of these jobs changed: show it without a reload.
    onPushUpdate(() => { loadJobs().catch(() => {}); });
    await loadJobs();
  })();
</script>
</body>
</html>
