<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Find Fundi</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { navy: { DEFAULT: '#041530', soft: '#0D2547' }, orange: { DEFAULT: '#FE6902' } },
      fontFamily: { display: ['"Poppins"', 'sans-serif'], body: ['"Inter"', 'sans-serif'] },
    } }
  }
</script>
<style>
  body { -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid #FE6902; outline-offset: 2px; border-radius: 2px; }
  .btn-primary {
    background: linear-gradient(180deg, #FE8A3D 0%, #FE6902 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 10px 22px -6px rgba(254,105,2,0.45);
    transition: transform 180ms cubic-bezier(.22,1,.36,1), filter 180ms ease;
  }
  .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.03); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-primary:disabled { opacity: 0.6; pointer-events: none; }
  input:focus { border-color: #FE6902; box-shadow: 0 0 0 3px rgba(254,105,2,0.12); }
</style>
</head>
<body class="bg-gray-50 text-navy font-body antialiased min-h-screen flex items-center justify-center px-5 py-12">

<div class="w-full max-w-md">
  <a href="index.html" class="flex items-center justify-center gap-2.5 mb-8">
    <img src="assets/logo-mark.png" alt="Find Fundi" class="h-9 w-9 object-contain">
    <span class="font-display font-700 text-lg"><span class="text-navy">Find</span><span class="text-orange">Fundi</span></span>
  </a>

  <div class="bg-white rounded-2xl border border-navy/10 shadow-sm p-7 md:p-8">
    <h1 class="font-display font-800 text-[1.6rem] tracking-[-0.01em] text-navy">Welcome back</h1>
    <p class="mt-1.5 text-navy/60 text-[14.5px]">Sign in to manage your jobs.</p>

    <button type="button" id="googleBtn" class="w-full mt-5 flex items-center justify-center gap-2.5 border border-navy/15 rounded-lg py-2.5 text-[14.5px] font-semibold text-navy hover:bg-navy/5 transition-colors">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C33.9 6 29.2 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C33.9 6 29.2 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.6 2.3-7.2 2.3-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C40.9 36 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      Continue with Google
    </button>

    <div class="flex items-center gap-3 my-5">
      <div class="h-px bg-navy/10 flex-1"></div>
      <span class="text-[11.5px] text-navy/40 font-semibold tracking-wide">OR</span>
      <div class="h-px bg-navy/10 flex-1"></div>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-[13px] font-semibold text-navy/70 mb-1.5" for="email">Email</label>
        <input id="email" required type="email" class="w-full rounded-lg border border-navy/15 px-3.5 py-2.5 text-[15px] outline-none" placeholder="jane@example.com">
      </div>
      <div>
        <label class="block text-[13px] font-semibold text-navy/70 mb-1.5" for="password">Password</label>
        <input id="password" required type="password" class="w-full rounded-lg border border-navy/15 px-3.5 py-2.5 text-[15px] outline-none" placeholder="Your password">
      </div>

      <p id="formError" class="hidden text-[13.5px] text-red-600"></p>

      <button type="submit" id="submitBtn" class="btn-primary w-full text-white font-semibold text-[15px] px-6 py-3 rounded-lg">
        Sign in
      </button>
    </form>

    <p class="mt-6 text-center text-[14px] text-navy/60">Don't have an account? <a href="signup.html" class="text-orange font-semibold hover:underline">Sign up</a></p>
  </div>
</div>

<script src="assets/supabase-client.js"></script>
<script>
  const nextParam = new URLSearchParams(window.location.search).get('next');

  document.getElementById('googleBtn').addEventListener('click', async () => {
    const redirectTo = `${window.location.origin}/profile.html${nextParam ? `?next=${encodeURIComponent(nextParam)}` : ''}`;
    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
  });

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const formError = document.getElementById('formError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;

      let profile = null;
      try {
        profile = await apiFetch('/profile/me');
      } catch (err) {
        if (err.message !== 'Not found.') throw err;
      }

      if (!profile) {
        // Signed in, but setup was never finished — send them to complete it.
        window.location.href = `profile.html${nextParam ? `?next=${encodeURIComponent(nextParam)}` : ''}`;
        return;
      }
      window.location.href = nextParam || (profile.role === 'fundi' ? 'job-feed.html' : 'my-jobs.html');
    } catch (err) {
      formError.textContent = err.message || 'Something went wrong.';
      formError.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
